name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}

      # CPU wheels: the runner has no GPU, and the CUDA build is a ~3GB download.
      # Everything under test is device-agnostic; only the demo scripts touch CUDA.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Everything else from requirements.txt, minus torch, which is already installed from
          # the CPU index above. A second hand-kept list here drifts from the real one.
          grep -v '^torch' requirements.txt | pip install -r /dev/stdin
          pip install -e .

      # Before the tests: it takes a second, and it catches the bugs no test was written for.
      - name: Lint
        run: ruff check src scripts tests

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest tests/ -v --tb=short
